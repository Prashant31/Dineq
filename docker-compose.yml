version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dineq_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: dineq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: dineq_backend
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:admin123@db:5432/dineq
      JWT_SECRET: mysecretkey123
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy &&
             node prisma/seed.js &&
             node server.js"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dineq_frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: